name: Release

# Builds the installable theme ZIP and publishes a GitHub release.
#
# Runs when a version tag (for example v1.0.0) is pushed, or when started by
# hand from the Actions tab ("Run workflow"). A manual run releases the version
# found in style.css and creates the matching tag on the selected commit. Tick
# "replace" to publish that version again in place of an existing release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace the existing release and tag of this version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Work out the version and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          VERSION="$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1)"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match style.css version $VERSION" >&2
            exit 1
          fi
          if ! grep -q "^Stable tag: $VERSION$" readme.txt; then
            echo "readme.txt Stable tag does not match style.css version $VERSION" >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$REPLACE" = "true" ]; then
              echo "Replacing the existing release $TAG."
              gh release delete "$TAG" --cleanup-tag --yes
            else
              echo "Release $TAG already exists. Bump the version, or run again with \"replace\" ticked." >&2
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the theme ZIP
        run: |
          bash bin/build-zip.sh
          cp dist/open-frame.zip "dist/open-frame-$VERSION.zip"
          ( cd dist && sha256sum "open-frame-$VERSION.zip" > "open-frame-$VERSION.zip.sha256" )

      - name: Collect the release notes from readme.txt
        run: |
          {
            echo "## Open Frame $VERSION"
            echo
            awk -v ver="= $VERSION =" '$0 == ver { found = 1; next } found && /^= .* =$/ { exit } found { print }' readme.txt
            echo
            echo "**Install:** download \`open-frame-$VERSION.zip\` below and upload it under *Appearance → Themes → Add Theme → Upload Theme*."
            echo
            echo "**Documentation:** [docs/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/README.md)"
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/open-frame-$VERSION.zip" \
            "dist/open-frame-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Open Frame v$VERSION" \
            --notes-file release-notes.md
