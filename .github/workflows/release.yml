name: Release

# Builds an installable ZIP with its checksum and publishes a GitHub release.
# The theme and the Starter Sites plugin are released separately, each with
# its own version number and its own tag:
#
#   theme    tag v1.1.0                 package open-frame-1.1.0.zip
#   plugin   tag starter-sites-v1.0.0   package open-frame-starter-sites-1.0.0.zip
#
# It runs when such a tag is pushed, or when started by hand from the Actions
# tab ("Run workflow"), where you choose the product. A manual run releases the
# version found in the files and creates the matching tag on the selected
# commit. Tick "replace" to publish that version again in place of an existing
# release.
#
# bin/release-package.sh does the checking and packaging; run it on your own
# machine to see what a release would contain. docs/dev/RELEASE.md is the
# checklist to go through before starting this workflow.
on:
  push:
    tags:
      - 'v*'
      - 'starter-sites-v*'
  workflow_dispatch:
    inputs:
      product:
        description: 'What to release'
        type: choice
        options:
          - theme
          - plugin
        default: theme
      replace:
        description: 'Replace the existing release and tag of this version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check and build the package
        env:
          PRODUCT_INPUT: ${{ inputs.product }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              starter-sites-v*) PRODUCT=plugin ;;
              *) PRODUCT=theme ;;
            esac
          else
            PRODUCT="${PRODUCT_INPUT:-theme}"
          fi
          read -r TAG VERSION SLUG <<< "$(bash bin/release-package.sh "$PRODUCT" | tail -n 1)"
          [ -n "$TAG" ] && [ -n "$VERSION" ] && [ -n "$SLUG" ]
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SLUG=$SLUG"
            echo "PRODUCT=$PRODUCT"
          } >> "$GITHUB_ENV"

      - name: Make room for the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$REPLACE" = "true" ]; then
              echo "Replacing the existing release $TAG."
              gh release delete "$TAG" --cleanup-tag --yes
            else
              echo "Release $TAG already exists. Bump the version, or run again with \"replace\" ticked." >&2
              exit 1
            fi
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRODUCT" = "plugin" ]; then TITLE="Open Frame Starter Sites v$VERSION"; else TITLE="Open Frame v$VERSION"; fi
          # The newest theme release stays the one GitHub shows as "Latest".
          if [ "$PRODUCT" = "plugin" ]; then LATEST="--latest=false"; else LATEST="--latest"; fi
          gh release create "$TAG" \
            "dist/$SLUG-$VERSION.zip" \
            "dist/$SLUG-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "dist/$SLUG-release-notes.md" \
            $LATEST
