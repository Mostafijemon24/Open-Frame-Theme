<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="of-hero-title">
	<title id="of-hero-title">Layered website frames</title>
	<defs>
		<linearGradient id="of-a" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5b67e8"/>
			<stop offset="1" stop-color="#2b36b8"/>
		</linearGradient>
		<linearGradient id="of-b" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#14b8a6"/>
			<stop offset="1" stop-color="#0e8f86"/>
		</linearGradient>
		<linearGradient id="of-c" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e8eafc"/>
			<stop offset="1" stop-color="#f8fafc"/>
		</linearGradient>
		<filter id="of-s" x="-40%" y="-40%" width="180%" height="190%">
			<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
		</filter>
	</defs>

	<!-- Backdrop -->
	<rect x="60" y="40" width="600" height="480" rx="32" fill="url(#of-c)"/>
	<circle cx="610" cy="96" r="54" fill="#f5a623" opacity="0.9"/>
	<circle cx="112" cy="470" r="34" fill="#d6f5f0"/>
	<g fill="#cbd5e1">
		<circle cx="96" cy="84" r="3"/><circle cx="116" cy="84" r="3"/><circle cx="136" cy="84" r="3"/>
		<circle cx="96" cy="104" r="3"/><circle cx="116" cy="104" r="3"/><circle cx="136" cy="104" r="3"/>
		<circle cx="96" cy="124" r="3"/><circle cx="116" cy="124" r="3"/><circle cx="136" cy="124" r="3"/>
	</g>

	<!-- Main browser frame -->
	<g filter="url(#of-s)">
		<rect x="120" y="96" width="440" height="330" rx="18" fill="#ffffff"/>
		<path d="M120 114a18 18 0 0 1 18-18h404a18 18 0 0 1 18 18v26H120z" fill="#f1f5f9"/>
		<circle cx="146" cy="118" r="6" fill="#f5a623"/>
		<circle cx="166" cy="118" r="6" fill="#14b8a6"/>
		<circle cx="186" cy="118" r="6" fill="#5b67e8"/>
		<rect x="226" y="110" width="220" height="16" rx="8" fill="#e2e8f0"/>

		<!-- Site header -->
		<rect x="146" y="160" width="62" height="12" rx="6" fill="#0f172a"/>
		<rect x="392" y="162" width="34" height="8" rx="4" fill="#cbd5e1"/>
		<rect x="436" y="162" width="34" height="8" rx="4" fill="#cbd5e1"/>
		<rect x="480" y="156" width="54" height="20" rx="10" fill="url(#of-a)"/>

		<!-- Hero block -->
		<rect x="146" y="196" width="388" height="118" rx="12" fill="url(#of-a)"/>
		<rect x="170" y="222" width="170" height="14" rx="7" fill="#ffffff"/>
		<rect x="170" y="246" width="230" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
		<rect x="170" y="262" width="190" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
		<rect x="170" y="282" width="70" height="18" rx="9" fill="#ffffff"/>
		<circle cx="474" cy="255" r="36" fill="#ffffff" opacity="0.16"/>
		<circle cx="474" cy="255" r="20" fill="#ffffff" opacity="0.28"/>

		<!-- Cards row -->
		<g>
			<rect x="146" y="330" width="118" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
			<rect x="158" y="342" width="26" height="26" rx="8" fill="#e8eafc"/>
			<rect x="158" y="378" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
			<rect x="158" y="390" width="56" height="7" rx="3.5" fill="#e2e8f0"/>

			<rect x="281" y="330" width="118" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
			<rect x="293" y="342" width="26" height="26" rx="8" fill="#d6f5f0"/>
			<rect x="293" y="378" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
			<rect x="293" y="390" width="56" height="7" rx="3.5" fill="#e2e8f0"/>

			<rect x="416" y="330" width="118" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
			<rect x="428" y="342" width="26" height="26" rx="8" fill="#fdf0d9"/>
			<rect x="428" y="378" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
			<rect x="428" y="390" width="56" height="7" rx="3.5" fill="#e2e8f0"/>
		</g>
	</g>

	<!-- Floating palette card -->
	<g filter="url(#of-s)">
		<rect x="478" y="318" width="188" height="150" rx="16" fill="#ffffff"/>
		<rect x="498" y="338" width="78" height="9" rx="4.5" fill="#0f172a"/>
		<circle cx="514" cy="382" r="16" fill="#3f4cd6"/>
		<circle cx="554" cy="382" r="16" fill="#14b8a6"/>
		<circle cx="594" cy="382" r="16" fill="#f5a623"/>
		<circle cx="634" cy="382" r="16" fill="#0f172a"/>
		<rect x="498" y="418" width="148" height="8" rx="4" fill="#e2e8f0"/>
		<rect x="498" y="418" width="96" height="8" rx="4" fill="url(#of-a)"/>
		<circle cx="594" cy="422" r="9" fill="#ffffff" stroke="#3f4cd6" stroke-width="3"/>
		<rect x="498" y="440" width="92" height="8" rx="4" fill="#e2e8f0"/>
	</g>

	<!-- Floating mobile frame -->
	<g filter="url(#of-s)">
		<rect x="62" y="232" width="124" height="232" rx="20" fill="#0f172a"/>
		<rect x="70" y="240" width="108" height="216" rx="14" fill="#ffffff"/>
		<rect x="82" y="254" width="40" height="8" rx="4" fill="#0f172a"/>
		<rect x="148" y="252" width="18" height="12" rx="4" fill="#e8eafc"/>
		<rect x="82" y="276" width="84" height="62" rx="8" fill="url(#of-b)"/>
		<rect x="82" y="350" width="70" height="8" rx="4" fill="#0f172a"/>
		<rect x="82" y="366" width="84" height="6" rx="3" fill="#cbd5e1"/>
		<rect x="82" y="378" width="60" height="6" rx="3" fill="#cbd5e1"/>
		<rect x="82" y="400" width="84" height="22" rx="8" fill="url(#of-a)"/>
		<rect x="104" y="408" width="40" height="6" rx="3" fill="#ffffff"/>
	</g>
</svg>
